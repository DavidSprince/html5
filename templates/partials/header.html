<header id="site-header" class="sticky top-0 z-50 backdrop-blur bg-white/85 border-b border-transparent transition-shadow">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between gap-4">
      <a href="{{ root }}index.html" class="flex items-center gap-2 shrink-0 group">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-md shadow-indigo-500/30 transition-transform group-hover:scale-105 group-hover:-rotate-3">
          {{ icon('Download', 'h-5 w-5') }}
        </span>
        <span class="text-lg font-extrabold tracking-tight text-slate-900">
          Reels<span class="text-indigo-600">Hub</span>
          <span class="hidden sm:inline text-slate-400 font-medium"> Vault</span>
        </span>
      </a>

      <nav class="hidden md:flex items-center gap-1">
        <a href="{{ root }}index.html" class="nav-link px-3 py-2 rounded-lg text-sm font-semibold transition-colors text-slate-600 hover:text-indigo-700 hover:bg-slate-50 {{ 'active text-indigo-700' if active_nav == 'home' else '' }}">Home</a>
        <a href="{{ root }}bundles.html" class="nav-link px-3 py-2 rounded-lg text-sm font-semibold transition-colors text-slate-600 hover:text-indigo-700 hover:bg-slate-50 {{ 'active text-indigo-700' if active_nav == 'bundles' else '' }}">All Bundles</a>
        <a href="{{ root }}about.html" class="nav-link px-3 py-2 rounded-lg text-sm font-semibold transition-colors text-slate-600 hover:text-indigo-700 hover:bg-slate-50 {{ 'active text-indigo-700' if active_nav == 'about' else '' }}">About</a>
        <a href="{{ root }}contact.html" class="nav-link px-3 py-2 rounded-lg text-sm font-semibold transition-colors text-slate-600 hover:text-indigo-700 hover:bg-slate-50 {{ 'active text-indigo-700' if active_nav == 'contact' else '' }}">Contact</a>
      </nav>

      <div class="hidden md:flex items-center gap-3">
        <form action="{{ root }}bundles.html" method="get" class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">{{ icon('Search', 'h-4 w-4') }}</span>
          <input name="q" type="search" placeholder="Search bundles..." class="w-52 rounded-full border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500/40 focus:bg-white transition" />
        </form>
        <a href="{{ root }}bundles.html" class="inline-flex items-center gap-1.5 rounded-full bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm shadow-indigo-500/30 hover:bg-indigo-700 transition-colors active:scale-95">
          {{ icon('Download', 'h-4 w-4') }} Browse All
        </a>
      </div>

      <button id="mobile-menu-btn" class="md:hidden inline-flex h-10 w-10 items-center justify-center rounded-lg text-slate-600 hover:bg-slate-100" aria-label="Toggle menu">
        <span id="icon-menu">{{ icon('Menu', 'h-5 w-5') }}</span>
        <span id="icon-close" class="hidden">{{ icon('X', 'h-5 w-5') }}</span>
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="mobile-menu md:hidden border-t border-slate-200 bg-white">
    <div class="px-4 pb-4 pt-3 space-y-3">
      <form action="{{ root }}bundles.html" method="get" class="relative">
        <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">{{ icon('Search', 'h-4 w-4') }}</span>
        <input name="q" type="search" placeholder="Search bundles..." class="w-full rounded-full border border-slate-200 bg-slate-50 py-2.5 pl-9 pr-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500/40" />
      </form>
      <nav class="flex flex-col gap-1">
        <a href="{{ root }}index.html" class="px-3 py-2.5 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50">Home</a>
        <a href="{{ root }}bundles.html" class="px-3 py-2.5 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50">All Bundles</a>
        <a href="{{ root }}about.html" class="px-3 py-2.5 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50">About</a>
        <a href="{{ root }}contact.html" class="px-3 py-2.5 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50">Contact</a>
      </nav>
    </div>
  </div>
</header>
